name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep tests, release builds, and runtime notices on the same toolchain.
  GO_VERSION: '1.26.1'

jobs:
  control-server:
    # The tag run tests release commits; avoid repeating them on the branch push.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: control-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-server/go.sum
      - run: go test -race ./...
      - run: go vet ./...

  plugin:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:packaging
      - run: npm run build

  release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tag matches the extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const version = require('./plugin/package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}, matching plugin/package.json`);
          }
          NODE

  android-agent:
    needs: [release-tag, control-server, plugin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override the action's default, which includes the unavailable legacy 'tools' package.
          packages: platform-tools
      - name: Install the agent's Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - name: Build an isolated copy of the Android agent
        run: |
          cp -a control-server/third_party/screen_sharing_service "$RUNNER_TEMP/valdroid-agent"
          cd "$RUNNER_TEMP/valdroid-agent"
          bash ./gradlew --no-daemon :app:assembleDebug
      - name: Collect the agent archive and all four ABI libraries
        run: |
          app="$RUNNER_TEMP/valdroid-agent/app"
          bundle="$RUNNER_TEMP/valdroid-agent-bundle"
          mkdir -p "$bundle"
          cp "$app/build/outputs/apk/debug/app-debug.apk" "$bundle/screen-sharing-agent.jar"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            source="$app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/$abi/libscreen-sharing-agent.so"
            test -s "$source"
            mkdir -p "$bundle/agent-libs/$abi"
            cp "$source" "$bundle/agent-libs/$abi/libscreen-sharing-agent.so"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android-agent
          path: ${{ runner.temp }}/valdroid-agent-bundle/
          if-no-files-found: error
          retention-days: 7

  release-packages:
    needs: android-agent
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            goos: windows
            goarch: amd64
            executable: control-server.exe
          - target: linux-x64
            goos: linux
            goarch: amd64
            executable: control-server
          - target: linux-arm64
            goos: linux
            goarch: arm64
            executable: control-server
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            executable: control-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: android-agent
          path: plugin/bundle/${{ matrix.target }}
      - name: Build the platform server with source provenance
        working-directory: control-server
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SERVER_OUTPUT: ../plugin/bundle/${{ matrix.target }}/${{ matrix.executable }}
        run: go build -buildvcs=true -o "$SERVER_OUTPUT" .
      - run: npm ci
        working-directory: plugin
      - name: Package the release VSIX
        working-directory: plugin
        env:
          VSCODE_TARGET: ${{ matrix.target }}
        run: npm run vsix -- --release --target "$VSCODE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: plugin/releases/*.vsix
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: plugin/bundle/${{ matrix.target }}/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7

  release-universal:
    needs: release-packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: ${{ runner.temp }}/valdroid-servers
      - uses: actions/download-artifact@v8
        with:
          name: android-agent
          path: ${{ runner.temp }}/valdroid-agent-bundle
      - name: Assemble all platform bundles
        run: |
          for target in darwin-arm64 linux-arm64 linux-x64 win32-x64; do
            bundle="plugin/bundle/$target"
            mkdir -p "$bundle"
            cp -a "$RUNNER_TEMP/valdroid-servers/server-$target/." "$bundle/"
            cp -a "$RUNNER_TEMP/valdroid-agent-bundle/." "$bundle/"
          done
      - run: npm ci
        working-directory: plugin
      - name: Package the universal release VSIX
        working-directory: plugin
        run: npm run vsix -- --release --universal
      - name: Verify universal executable permissions and report size
        working-directory: plugin
        run: |
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          package, = Path('releases').glob('*-universal.vsix')
          with ZipFile(package) as archive:
              assert b'TargetPlatform=' not in archive.read('extension.vsixmanifest')
              bundles = {name.split('/')[2] for name in archive.namelist() if name.startswith('extension/bundle/')}
              assert bundles == {'darwin-arm64', 'linux-arm64', 'linux-x64', 'win32-x64'}, bundles
              servers = [entry for entry in archive.infolist() if entry.filename.endswith('/control-server')]
              assert len(servers) == 3, 'Expected all three Unix server binaries'
              for entry in servers:
                  assert (entry.external_attr >> 16) & 0o111, f'Missing executable permissions: {entry.filename}'
          print(f'{package.name}: {package.stat().st_size:,} bytes ({package.stat().st_size / 1024**2:.2f} MiB)')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-universal
          path: plugin/releases/*-universal.vsix
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [release-packages, release-universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: plugin/releases
          merge-multiple: true
      - name: Generate release checksums
        working-directory: plugin/releases
        run: sha256sum *.vsix > SHA256SUMS
      - name: Create the GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" plugin/releases/*.vsix plugin/releases/SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${prerelease_args[@]}"
